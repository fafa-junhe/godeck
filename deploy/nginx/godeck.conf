# ==============================================================================
# GoDeck Hub Nginx Independent Server Configuration
# Domain: godeck.junher.top
# Port: 8443 (TLS proxy to Hub 127.0.0.1:8787)
# Note: Cloudflare officially supports proxying port 8443.
#
# 安全与性能原则：
# 1. 独立 server 块，不侵入 Nginx 全局配置与同机既有 sub2api / Xray 服务。
# 2. 证书使用专用隔离目录 /etc/godeck/tls (root:0700, 私钥 0600)。
# 3. 敏感接口禁止记录 Authorization 凭据与请求体。
# 4. 禁用缓冲与缓存以保障长轮询（/v1/session/wait）与信令实时性。
# ==============================================================================

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name godeck.junher.top;

    # 证书路径（统一使用 privkey.pem，目录 root:0700，私钥 0600，Nginx master root 读取）
    ssl_certificate     /etc/godeck/tls/fullchain.pem;
    ssl_certificate_key /etc/godeck/tls/privkey.pem;

    # TLS 安全协议与套件
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:GoDeckSSL:2m;
    ssl_session_timeout 1h;

    # 基础安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # 关闭访问日志防止小机磁盘写满，仅保留专用错误日志
    access_log off;
    error_log  /var/log/nginx/godeck-hub.error.log warn;

    # WebSocket 隧道中继转发 (/v1/session/ws)
    location = /v1/session/ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
    }

    # 全局反向代理至 GoDeck Hub 本地服务
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长轮询与长连接支持 (/v1/session/wait 挂起可达 25s+)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;

        # 禁用缓冲与缓存，保障信令实时性
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
    }

    # 敏感接口安全限制（严禁记录 Authorization 凭据与请求体，适度缩短读超时）
    location ~* ^/v1/(setup|login|password|pair) {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
    }
}
