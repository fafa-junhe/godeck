# ==============================================================================
# GoDeck Dedicated Logrotate Configuration
# Scope: Only GoDeck Hub, Coturn, Cert-Renew, and GoDeck Nginx Error logs
# Prevents permission crossing using explicit 'su' directives
# ==============================================================================

/var/log/godeck-hub/*.log /var/log/godeck-hub/*.err {
    su godeck godeck
    daily
    rotate 3
    missingok
    notifempty
    compress
    maxsize 5M
    copytruncate
}

/var/log/godeck-turn/*.log {
    su turnserver turnserver
    daily
    rotate 3
    missingok
    notifempty
    compress
    maxsize 5M
    copytruncate
}

/var/log/godeck-cert-renew/*.log {
    su root root
    daily
    rotate 3
    missingok
    notifempty
    compress
    maxsize 5M
    copytruncate
}

/var/log/nginx/godeck-hub.error.log {
    su root root
    daily
    rotate 3
    missingok
    notifempty
    compress
    maxsize 5M
    copytruncate
}
