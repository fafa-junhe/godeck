# ==============================================================================
# GoDeck Coturn Configuration (Artix Linux / 1GiB RAM VPS)
# Target Server: YOUR_SERVER_IP
# Realm: godeck.junher.top
# ==============================================================================

# 1. 监听接口与公网 IP 映射
listening-port=3478
listening-ip=YOUR_SERVER_IP
listening-ip=127.0.0.1
external-ip=YOUR_SERVER_IP
relay-ip=YOUR_SERVER_IP

# 2. 受限 Relay 端口范围（49160 到 49200，共 41 个 UDP 端口）
# 严格限制端口范围以适配 1GiB 内存小机，防止内存与端口耗尽
min-port=49160
max-port=49200

# 3. Realm 与动态鉴权机制
realm=godeck.junher.top
use-auth-secret
# 必须与 Hub 的 -turn-secret-file 内容严格一致（最少 16 字节高熵随机串）
# 真实部署时替换为实际随机生成的密钥，严禁提交明文至 Git 仓库
static-auth-secret=REPLACE_WITH_SHARED_SECRET_AT_DEPLOYMENT

# 4. 安全防护与行为限制
no-cli
no-tls
no-dtls
no-tcp-relay
no-multicast-peers
fingerprint

# 5. 1GiB 内存小机并发与资源限制
# 41 个 relay 端口最多支撑约 40 个并发分配
total-quota=40
user-quota=10
max-bps=5000000
bps-capacity=10000000
stale-nonce=600

# 6. 安全拦截：禁止中继流量流向回环、内网私有网段、链路本地与组播
# 注意：使用现代 coturn 标准的 denied-peer-ip 指令，严禁使用旧版无效的 no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-239.255.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# 7. 运行与日志配置（避免小机磁盘被详细调试日志写满）
simple-log
log-file=/var/log/godeck-turn/turnserver.log
pidfile=/run/godeck-turn/turnserver.pid
